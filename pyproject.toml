[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netflower"
version = "1.0.4"
description = "High-performance network flow extractor. Captures bidirectional flows from live network interfaces or .pcap / .pcapng files and produces 82 features."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luiz Henrique", email = "luizlinkezio@gmail.com" }]
requires-python = ">=3.10"
keywords = ["python", "flow", "csv", "pcap", "network", "live", "capture"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/luiz-linkezio/netflower"

[tool.setuptools.packages.find]
where = ["."]
include = ["netflower*"]

[tool.ruff]
line-length = 100
